[package]
name = "linha"
version = "0.6.0"
edition = "2021"
description = "Linha do tempo do seu dia: Outlook, Google e iCloud num relance, sempre que o computador desperta."
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
roxmltree = "0.21"
tiny_http = "0.12"
webbrowser = "1"
directories = "6"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
anyhow = "1"
egui_extras = { version = "0.37", default-features = false, features = ["datepicker"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
